version: 0.2

env:
  secrets-manager:
    GITHUB_TOKEN: "pilotlight/github-token:token"
    BOX_CLIENT_ID: "pilotlight/box-creds:client_id"
    BOX_CLIENT_SECRET: "pilotlight/box-creds:client_secret"
    BOX_ENTERPRISE_ID: "pilotlight/box-creds:enterprise_id"
  variables:
    INCIDENT_ID: ""
    TASK_ID: ""
    TASK_JSON: ""
    REPO_URL: ""
    BOX_FOLDER_ID: ""
    BOX_INCIDENTS_FOLDER_ID: ""
    AWS_REGION: "us-east-1"

phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 20
    commands:
      # Install Claude Code
      - npm install -g @anthropic-ai/claude-code
      # Install Python deps
      - pip install boto3 box-sdk-gen python-dotenv pytest
      # Install gh CLI
      - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
      - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
      - apt-get update && apt-get install -y gh
      # Auth gh
      - echo "$GITHUB_TOKEN" | gh auth login --with-token
      # Clone the repo
      - git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_URL}.git" /workspace
      # Install pilotlight package in the workspace
      - cd /workspace && pip install -e . 2>/dev/null || pip install boto3 box-sdk-gen python-dotenv

  pre_build:
    commands:
      - cd /workspace
      - git checkout -b "auto-fix/${INCIDENT_ID}/${TASK_ID}"
      # Download context files from Box into workspace
      - python -m pilotlight.auto_fix.download_context || echo "Context download skipped"
      - mkdir -p /workspace/context

  build:
    commands:
      - cd /workspace
      # Build the prompt from task JSON and run Claude Code via Bedrock
      - |
        python -c "
        from pilotlight.auto_fix.prompt import AGENT_PROMPT
        import os, json
        task = json.loads(os.environ.get('TASK_JSON', '{}'))
        print(AGENT_PROMPT.format(
            incident_id=os.environ.get('INCIDENT_ID', ''),
            task_id=os.environ.get('TASK_ID', ''),
            task_title=task.get('title', ''),
            task_json=json.dumps(task, indent=2),
            alarm_name=task.get('alarm_name', ''),
            service=task.get('service', 'checkout-api'),
            box_folder_url=f'https://app.box.com/folder/{os.environ.get(\"BOX_FOLDER_ID\", \"\")}',
            past_fixes_context=task.get('past_fixes_context', 'No past fixes found.')
        ))
        " > /tmp/prompt.txt
      - |
        cd /workspace && claude --use-bedrock --print --output-format text \
          --prompt "$(cat /tmp/prompt.txt)" \
          2>&1 | tee /tmp/claude_output.txt

  post_build:
    commands:
      - cd /workspace
      - export CLAUDE_OUTPUT_FILE=/tmp/claude_output.txt
      - python -m pilotlight.auto_fix.agent_runner
